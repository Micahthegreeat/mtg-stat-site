<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jsPDF Browser Example</title>
    <!-- Load jsPDF from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <button id="download-btn">Generate and Download PDF</button>

    <script>
        document.getElementById('download-btn').addEventListener('click', () => {
            // Access the jsPDF constructor from the global window object
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Add text at specific X and Y coordinates (in millimeters by default)
            doc.setFontSize(16);
            doc.text("Hello World!", 20, 20);
            
            doc.setFontSize(12);
            doc.text("This PDF was created directly in the browser.", 20, 30);

            // Trigger browser download dialog
            doc.save("document.pdf");
        });
    </script>
    
</body>
</html>
